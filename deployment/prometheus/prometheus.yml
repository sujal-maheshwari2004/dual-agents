global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: dual-agents-backend
    # For local docker-compose: target is the backend container name.
    # For Cloud Run: replace with the backend service URL and add bearer_token_file
    # or basic_auth if you add auth to /metrics.
    static_configs:
      - targets:
          - backend:8000   # docker-compose service name
    metrics_path: /metrics
    scheme: http

  # Uncomment and fill in for Cloud Run scraping via public /metrics endpoint.
  # - job_name: dual-agents-backend-cloudrun
  #   static_configs:
  #     - targets:
  #         - <backend-service-url>.run.app
  #   metrics_path: /metrics
  #   scheme: https