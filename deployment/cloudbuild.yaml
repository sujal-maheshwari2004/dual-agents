# cloudbuild.yaml — monorepo CI/CD for GCP Cloud Run
#
# Substitutions (set in Cloud Build trigger or --substitutions flag):
#   _REGION          e.g. us-central1
#   _BACKEND_SERVICE e.g. dual-agents-backend
#   _GRAFANA_SERVICE e.g. dual-agents-grafana
#   _MONGODB_URI     MongoDB Atlas connection string (use Secret Manager ref)
#   _OPENAI_API_KEY  OpenAI key (use Secret Manager ref)
#   _HF_TOKEN        Hugging Face token
#   _PROMETHEUS_URL  Backend Cloud Run URL, used by Grafana datasource

substitutions:
  _REGION: us-central1
  _BACKEND_SERVICE: dual-agents-backend
  _GRAFANA_SERVICE: dual-agents-grafana

steps:

  # ── 1. Build backend image ───────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-backend
    args:
      - build
      - -f
      - deployment/Dockerfile.backend
      - -t
      - gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:$SHORT_SHA
      - -t
      - gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:latest
      - .
    waitFor: ['-']

  # ── 2. Push backend image ────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-backend
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/$_BACKEND_SERVICE
    waitFor: ['build-backend']

  # ── 3. Deploy backend to Cloud Run ──────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-backend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_BACKEND_SERVICE
      - --image=gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --port=8000
      - --set-env-vars=ENVIRONMENT=production
      - --update-secrets=OPENAI_API_KEY=openai-api-key:latest,HF_TOKEN=hf-token:latest,MONGODB_URI=mongodb-uri:latest,LANGCHAIN_API_KEY=langchain-api-key:latest,AZURE_TRANSLATOR_KEY=azure-translator-key:latest,AZURE_TRANSLATOR_REGION=azure-translator-region:latest
    waitFor: ['push-backend']

  # ── 4. Build Grafana image ───────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-grafana
    args:
      - build
      - -f
      - deployment/Dockerfile.grafana
      - -t
      - gcr.io/$PROJECT_ID/$_GRAFANA_SERVICE:$SHORT_SHA
      - -t
      - gcr.io/$PROJECT_ID/$_GRAFANA_SERVICE:latest
      - deployment/
    waitFor: ['-']

  # ── 5. Push Grafana image ────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-grafana
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/$_GRAFANA_SERVICE
    waitFor: ['build-grafana']

  # ── 6. Deploy Grafana to Cloud Run ──────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-grafana
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_GRAFANA_SERVICE
      - --image=gcr.io/$PROJECT_ID/$_GRAFANA_SERVICE:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=1
      - --port=3000
      - --set-env-vars=PROMETHEUS_URL=$_PROMETHEUS_URL
    waitFor: ['push-grafana']

images:
  - gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:$SHORT_SHA
  - gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:latest
  - gcr.io/$PROJECT_ID/$_GRAFANA_SERVICE:$SHORT_SHA
  - gcr.io/$PROJECT_ID/$_GRAFANA_SERVICE:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 900s