substitutions:
  _REGION: us-central1
  _BACKEND_SERVICE: dual-agents-backend
  _GRAFANA_SERVICE: dual-agents-grafana
  _PROMETHEUS_SERVICE: dual-agents-prometheus
  _PROMETHEUS_URL: https://dual-agents-prometheus-lmzcevoixa-uc.a.run.app

steps:

  # ── 1. Build backend image ─────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-backend
    args:
      - build
      - -f
      - deployment/Dockerfile.backend
      - -t
      - gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:latest
      - .
    waitFor: ['-']

  # ── 2. Push backend image ───────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-backend
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/$_BACKEND_SERVICE
    waitFor: ['build-backend']

  # ── 3. Deploy backend to Cloud Run ─────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-backend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_BACKEND_SERVICE
      - --image=gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:latest
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --port=8000
      - --set-env-vars=ENVIRONMENT=production
      - --update-secrets=OPENAI_API_KEY=openai-api-key:latest,HF_TOKEN=hf-token:latest,MONGODB_URI=mongodb-uri:latest,LANGCHAIN_API_KEY=langchain-api-key:latest
    waitFor: ['push-backend']

  # ── 4. Build Prometheus image ───────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-prometheus
    args:
      - build
      - -f
      - deployment/Dockerfile.prometheus
      - -t
      - gcr.io/$PROJECT_ID/$_PROMETHEUS_SERVICE:latest
      - deployment/
    waitFor: ['-']

  # ── 5. Push Prometheus image ────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-prometheus
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/$_PROMETHEUS_SERVICE
    waitFor: ['build-prometheus']

  # ── 6. Deploy Prometheus to Cloud Run ──────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-prometheus
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_PROMETHEUS_SERVICE
      - --image=gcr.io/$PROJECT_ID/$_PROMETHEUS_SERVICE:latest
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --memory=256Mi
      - --cpu=1
      - --min-instances=1
      - --max-instances=1
      - --port=9090
    waitFor: ['push-prometheus']

  # ── 7. Build Grafana image ──────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-grafana
    args:
      - build
      - -f
      - deployment/Dockerfile.grafana
      - -t
      - gcr.io/$PROJECT_ID/$_GRAFANA_SERVICE:latest
      - deployment/
    waitFor: ['-']

  # ── 8. Push Grafana image ───────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-grafana
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/$_GRAFANA_SERVICE
    waitFor: ['build-grafana']

  # ── 9. Deploy Grafana to Cloud Run ─────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-grafana
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_GRAFANA_SERVICE
      - --image=gcr.io/$PROJECT_ID/$_GRAFANA_SERVICE:latest
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=1
      - --port=3000
      - --set-env-vars=GF_AUTH_ANONYMOUS_ENABLED=true,GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.,GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer,GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=true,GF_USERS_ALLOW_SIGN_UP=false,PROMETHEUS_URL=$_PROMETHEUS_URL
    waitFor: ['push-grafana', 'deploy-prometheus']

images:
  - gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:latest
  - gcr.io/$PROJECT_ID/$_PROMETHEUS_SERVICE:latest
  - gcr.io/$PROJECT_ID/$_GRAFANA_SERVICE:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 900s